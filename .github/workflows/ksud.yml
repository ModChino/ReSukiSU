name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM fies
      if: ${{ inputs.pack_lkm }}
      run: |
        cp android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        # The artifact keeps whatever path upload-artifact chose as its root, so locate the
        # binary instead of guessing the layout ("ksuinit/*/release/ksuinit" matched nothing).
        # The artifact unpacks to an unknown depth: with `path` unset the downloader may or
        # may not wrap it in a directory named after the artifact.
        KSUINIT=$(find . -maxdepth 4 -type f -name ksuinit | head -n 1)
        if [ -z "$KSUINIT" ]; then
          echo "::error::ksuinit binary not found after download; candidates:"
          find . -maxdepth 4 -name 'ksuinit*' | head -20
          exit 1
        fi
        echo "using $KSUINIT"
        cp -f "$KSUINIT" ./userspace/ksud/bin/aarch64/
     
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ inputs.target }}
        components: rust-src
        
    - uses: Swatinem/rust-cache@v2
      if: github.event_name != 'pull_request'
      with:
        prefix-key: ksud-${{ inputs.target }}
        workspaces: userspace/ksud
        cache-targets: true
        
    - name: Setup cargo-ndk
      run: cargo install cargo-ndk --locked
        
    - name: Build ksud
      run: |
        cd userspace/ksud/
        # Mirror the current upstream command: the explicit build-std=std,core,panic_abort
        # list makes today's nightly fail with E0152 (duplicate lang item \`sized\` in core),
        # because core then gets compiled both by build-std and by the precompiled sysroot.
        cargo ndk b -P 26 -t ${{ inputs.target }} -r -Z build-std-features="optimize_for_size" -Z trim-paths

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: userspace/ksud/target/**/release/ksud*
